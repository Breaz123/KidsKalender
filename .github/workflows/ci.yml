name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build shared package
        run: npm run build -w @kids-calendar/shared
      
      - name: Lint
        run: npm run lint
        
      - name: Typecheck
        run: npm run typecheck
      
      - name: Build API
        run: npm run build -w @kids-calendar/api
      
      - name: Build Web
        run: npm run build -w @kids-calendar/web
      
      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          SESSION_SECRET: test-secret-for-ci-at-least-32-characters-long
          COOKIE_SECURE: 'false'
          # Note: DATABASE_URL is intentionally not set
          # Tests will skip DB-dependent tests when DB is unavailable
